# ============================================================================
#  Nginx — قالب إنتاج لمنصة khaledsaad
#  المسار: /etc/nginx/sites-available/khaledsaad.conf
#  تفعيل:
#    sudo ln -s /etc/nginx/sites-available/khaledsaad.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# إعادة توجيه HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    root /var/www/khaledsaad/public;
    index index.php;

    # --- شهادات SSL (Let's Encrypt / Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- رؤوس أمنية ---
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # --- الترميز ---
    charset utf-8;
    client_max_body_size 25M;

    # --- ملفات خاصة (منع الوصول) ---
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|env\..+|log|sql|md|lock|json|yaml|yml|ini|bak|sh|bat|ps1)$ { deny all; }
    location ~ ^/(storage/logs|vendor|node_modules|tests|database|bootstrap|config|routes|resources)/ { deny all; }

    # --- ضغط ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --- Cache للأصول الثابتة ---
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Laravel Front Controller ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.ht { deny all; }

    access_log /var/log/nginx/khaledsaad.access.log;
    error_log  /var/log/nginx/khaledsaad.error.log warn;
}
