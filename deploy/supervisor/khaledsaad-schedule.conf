; ============================================================================
;  Supervisor config — Laravel Schedule Runner (بديل Cron للتطبيقات طويلة العمر)
;  المسار: /etc/supervisor/conf.d/khaledsaad-schedule.conf
;
;  ملاحظة: البديل الأكثر شيوعاً في الإنتاج هو Cron:
;    * * * * * cd /var/www/khaledsaad && php artisan schedule:run >> /dev/null 2>&1
;
;  استخدم هذه الخدمة فقط إذا لم يكن Cron متاحاً.
; ============================================================================

[program:khaledsaad-schedule]
process_name=%(program_name)s
command=php /var/www/khaledsaad/artisan schedule:work
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/khaledsaad/schedule.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
