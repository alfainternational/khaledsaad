; ============================================================================
;  Supervisor config — Queue Worker لمنصة khaledsaad (Linux/Ubuntu)
;  المسار: /etc/supervisor/conf.d/khaledsaad-queue.conf
;
;  التفعيل بعد النسخ:
;    sudo supervisorctl reread
;    sudo supervisorctl update
;    sudo supervisorctl start khaledsaad-queue:*
;
;  إعادة تشغيل العمّال بعد Deploy:
;    sudo supervisorctl restart khaledsaad-queue:*
;    أو: php artisan queue:restart  (يطلب من كل worker الخروج برفق)
; ============================================================================

[program:khaledsaad-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/khaledsaad/artisan queue:work --queue=ai,integrations,exports,notifications,default --tries=3 --backoff=5,15,60 --max-time=3600 --sleep=3
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/khaledsaad/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
